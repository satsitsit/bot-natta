name: Run Telegram Music Bot

on:
  workflow_dispatch:        # bisa dijalankan manual
  schedule:
    - cron: '0 */6 * * *'   # nyala ulang tiap 6 jam

concurrency:
  group: music-bot
  cancel-in-progress: false # jangan sampai dua bot jalan bersamaan

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # batas GitHub 6 jam

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write cookies (opsional, dari Secret YT_COOKIES)
      env:
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
      run: |
        if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi

    - name: Run Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        OWNER_ID: ${{ secrets.OWNER_ID }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: python bot.py
